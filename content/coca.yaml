# Comunità Capi del Gruppo Scout Mirandola 1
#
# Ogni unità ha un nome, una branca (coca, lc, eg, rs) e l'elenco dei suoi capi,
# nell'ordine in cui compaiono sul sito. Per ogni capo:
#   nome, cognome, ruolo  obbligatori
#   codice                codice censimento AGESCI (facoltativo)
#   id                    facoltativo, solo per distinguere due omonimi
#
# La foto va messa in public/images/coca/<cognome>-<nome>.jpg, tutto minuscolo,
# senza accenti e con i trattini al posto degli spazi (es. da-como-chiara.jpg).
# Se l'id è indicato, la foto si chiama <id>.jpg. Senza foto viene mostrato un avatar.

